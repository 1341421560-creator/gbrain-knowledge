<path d="M716.5 140V470 M711.5 140H721.5 M711.5 470H721.5" fill="none" stroke="#94A3A0" stroke-width="1"/>
<text x="708.5" y="305" text-anchor="middle" transform="rotate(-90 708.5 305)" font-size="13" fill="#64746E">330 px</text>
<text x="815" y="509" text-anchor="middle" font-size="18" font-weight="700" fill="#10271E">161 × 330 px</text>
