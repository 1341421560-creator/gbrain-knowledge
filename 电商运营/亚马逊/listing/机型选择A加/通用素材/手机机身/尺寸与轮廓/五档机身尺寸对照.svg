<rect x="40" y="570" width="1120" height="56" rx="12" fill="#E8F2EB"/>
<g font-family="Arial, sans-serif" fill="#244F38"><text x="60" y="594" font-size="16" font-weight="700">6.1-inch = 100%   ·   6.7-inch = 110%   ·   6.9-inch = 113.3%</text><text x="60" y="615" font-size="14">Scale width and height by the same percentage. Keep the original aspect ratio of each actual device.</text></g>
