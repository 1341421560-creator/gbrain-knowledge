<text x="600" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#164E35">6.5-inch</text>
<g transform="translate(522 150)"><rect x="1.0666666666666667" y="1.0666666666666667" width="153.86666666666667" height="317.8666666666667" rx="21.333333333333332" fill="#E8EFEB" stroke="#64786E" stroke-width="2.1333333333333333"/></g>
<path d="M504 150V470 M499 150H509 M499 470H509" fill="none" stroke="#94A3A0" stroke-width="1"/>
<text x="496" y="310" text-anchor="middle" transform="rotate(-90 496 310)" font-size="13" fill="#64746E">320 px</text>
