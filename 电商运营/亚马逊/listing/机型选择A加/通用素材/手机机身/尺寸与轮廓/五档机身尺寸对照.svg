<path d="M929.5 130V470 M924.5 130H934.5 M924.5 470H934.5" fill="none" stroke="#94A3A0" stroke-width="1"/>
<text x="921.5" y="300" text-anchor="middle" transform="rotate(-90 921.5 300)" font-size="13" fill="#64746E">340 px</text>
<text x="1030" y="509" text-anchor="middle" font-size="18" font-weight="700" fill="#10271E">165 × 340 px</text>
