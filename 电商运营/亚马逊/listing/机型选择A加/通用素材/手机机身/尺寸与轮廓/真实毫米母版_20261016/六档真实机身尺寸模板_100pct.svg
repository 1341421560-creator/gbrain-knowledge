">iPhone 8 / SE 2020 / SE 2022</text><rect x="302.3556910569106" y="219.4491869918699" width="135.28861788617886" height="279.8008130081301" rx="24.621951219512194" fill="#E6EFE9" stroke="#668373" stroke-width="1.5"/><path d="M283.6056910569106 218.6991869918699v281.3008130081301m-5 0h10M278.6056910569106 218.6991869918699h10" fill="none" stroke="#BCD0C4" stroke-width="1"/><text x="274.6056910569106" y="359.349593495935" transform="rotate(-90 274.6056910569106 359.349593495935)" text-anchor="middle" font-size="12" fill="#5A7367">281.3 px</text><text x="370" y="540" font-size="17" fill="#153328" font-weight="700" text-anchor="middle">136.8 × 281.3 px</text><text x="370" y="569" font-size="14" fill="#5A7367" font-weight="400" text-anchor="middle">138.4 × 67.3 mm</text><rect x="517" y="104" width="146" height="29" rx="14.5" fill="#E8F2EC" stroke="none" stroke-width="1"/><text x="590" y="124" font-size="17" fill="#153328" font-weight="700" text-anchor="middle">5.4-inch</text><text x="590" y="154" font-size="12" fill="#5A7367" font-weight="500" text-anchor="middle">iPhone 12 mini / 13 mini</text><rect x="525.5060975609756" y="233.47357723577232" width="128.9878048780488" height="265.7764227642277" rx="23.48780487804878" fill="#E6EFE9" stroke="#668373" stroke-width="1.5"/><path d="M506.7560975609756 232.72357723577232v267.2764227642277m-5 0h10M501.7560975609756 232.72357723577232h10" fill="none" stroke="#BCD0C4" stroke-width="1"/><text x="497.7560975609756" y="366.3617886178862" transform="rotate(-90 497.7560975609756 366.3617886178862)" text-anchor="middle" font-size="12" fill="#5A7367">267.3 px</text><text x="590" y="540" font-size="17" fill="#153328" font-weight="700" text-anchor="middle">130.5 × 267.3 px</text><text x="590" y="569" font-size="14" fill="#5A7367" font-weight="400" text-anchor="middle">131.5 × 64.2 mm</text><rect x="737" y="104" width="146" height="29" rx="14.5" fill="#E8F2EC" stroke="none" stroke-width="1"/><text x="810" y="124" font-size="17" fill="#153328" font-weight="700" text-anchor="middle">5.5-inch</text><text x="810" y="154" font-size="12" fill="#5A7367" font-weight="500" text-anchor="middle">iPhone 8 Plus</text><rect x="731.380081300813" y="178.79878048780483" width="157.239837398374" height="320.45121951219517" rx="28.573170731707318" fill="#E6EFE9" stroke="#668373" stroke-width="1.5"/><path d="M712.630081300813 178.04878048780483v321.95121951219517m-5 0h10M707.630081300813 178.04878048780483h10" fill="none" stroke="#BCD0C4" stroke-width="1"/><text x="703.630081300813" y="339.0243902439024" transform="rotate(-90 703.630081300813 339.0243902439024)" text-anchor="middle" font-size="12" fill="#5A7367">322.0 px</text><text x="810" y="540" font-size="17" fill="#153328" font-weight="700" text-anchor="middle">158.7 × 322.0 px</text><text x="810" y="569" font-size="14" fill="#5A7367" font-weight="400" text-anchor="middle">158.4 × 78.1 mm</text><rect x="957" y="104" width="146" height="29" rx="14.5" fill="#E8F2EC" stroke="none" stroke-width="1"/><text x="1030" y="124" font-size="17" fill="#153328" font-weight="700" text-anchor="middle">5.8-inch</text><text x="1030" y="154" font-size="12" fill="#5A7367" font-weight="500" text-anchor="middle">iPhone X / XS</text><rect x="958.6971544715448" y="208.880081300813" width="142.6056910569106" height="290.369918699187" rx="25.939024390243905" fill="#E6EFE9" stroke="#668373" stroke-width="1.5"/><path d="M939.9471544715448 208.130081300813v291.869918699187m-5 0h10M934.9471544715448 208.130081300813h10" fill="none" stroke="#BCD0C4" stroke-width="1"/><text x="930.9471544715448" y="354.0650406504065" transform="rotate(-90 930.9471544715448 354.0650406504065)" text-anchor="middle" font-size="12" fill="#5A7367">291.9 px</text><text x="1030" y="540" font-size="17" fill="#153328" font-weight="700" text-anchor="middle">144.1 × 291.9 px</text><text x="1030" y="569" font-size="14" fill="#5A7367" font-weight="400" text-anchor="middle">143.6 × 70.9 mm</text><rect x="1177" y="104" width=